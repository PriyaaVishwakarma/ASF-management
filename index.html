<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASF Management — Security, Housekeeping & Manpower Services</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0c1a2e;
  --navy-2:#122744;
  --steel:#1c3557;
  --paper:#eef1f4;
  --paper-2:#dfe4e9;
  --red:#c8202f;
  --brass:#b6903f;
  --ink:#0c1a2e;
  --muted:#5c6b7d;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-behavior:smooth;scroll-padding-top:76px;}
*{box-sizing:border-box;}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:'Inter',sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.brand,.stat-num,.nav-links a,.btn{font-family:'Oswald',sans-serif;}
img{max-width:100%;display:block;}
.wrap{max-width:1140px;margin:0 auto;padding:0 24px;}

/* NAV */
header{
  position:sticky;top:0;z-index:50;background:var(--navy);
  border-bottom:3px solid var(--red);
  padding-top:env(safe-area-inset-top,0px);
}
.navbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;max-width:1140px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-size:20px;font-weight:600;letter-spacing:.5px;text-decoration:none;}
.brand .badge{width:44px;height:44px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;border:2px solid var(--brass);}
.brand-logo{width:90px;height:90px;object-fit:contain;background:#fff;border-radius:50%;padding:3px;border:2px solid var(--brass);}

/* FEATURED CLIENT LOGOS */
.client-logos{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:40px;}
.client-tile{background:#fff;border:1px solid var(--paper-2);overflow:hidden;transition:transform .2s,box-shadow .2s;}
.client-tile:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(12,26,46,.12);}
.client-tile .img-wrap{height:130px;overflow:hidden;background:#0c1a2e;display:flex;align-items:center;justify-content:center;}
.client-tile .img-wrap img{width:100%;height:100%;object-fit:cover;}
.client-tile.logo-only .img-wrap{background:#fff;padding:18px;}
.client-tile.logo-only .img-wrap img{object-fit:contain;}
.client-tile .cap{padding:14px 16px;}
.client-tile .cap h4{margin:0 0 3px;font-size:14.5px;color:var(--navy);}
.client-tile .cap span{font-size:12.5px;color:var(--muted);}

/* TEAM GALLERY */
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px;}
.gallery figure{margin:0;background:#fff;border:1px solid var(--paper-2);}
.gallery img{width:100%;height:220px;object-fit:cover;}
.gallery figcaption{padding:12px 16px;font-size:13.5px;color:var(--muted);border-top:3px solid var(--red);}
.gallery figcaption b{display:block;color:var(--navy);font-size:4.5px;margin-bottom:2px;}
.nav-links{display:flex;gap:26px;list-style:none;margin:0;padding:0;}
.nav-links a{color:#cfd8e3;text-decoration:none;font-size:24px;letter-spacing:.06em;text-transform:uppercase;transition:color .2s;}
.nav-links a:hover,.nav-links a:focus-visible{color:#fff;}
.nav-toggle{display:none;background:none;border:1px solid #3a4d68;color:#fff;padding:8px 10px;border-radius:4px;font-size:20px;line-height:1;}

/* HERO */
.hero{
  position:relative;background:
    linear-gradient(120deg,rgba(12,26,46,.94),rgba(12,26,46,.72)),
    repeating-linear-gradient(135deg,#13223a 0 2px,#0f1e34 2px 40px);
  color:#fff;padding:88px 0 76px;overflow:hidden;
}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:340px;height:340px;border:1px solid rgba(182,144,63,.35);border-radius:50%;}
.hero::before{content:"";position:absolute;right:40px;bottom:-120px;width:260px;height:260px;border:1px solid rgba(200,32,47,.25);border-radius:50%;}
.hero-inner{position:relative;z-index:2;max-width:680px;}
.eyebrow-line{display:flex;align-items:center;gap:12px;margin-bottom:20px;color:var(--brass);font-size:13px;letter-spacing:.14em;text-transform:uppercase;}
.eyebrow-line span.rule{width:40px;height:2px;background:var(--brass);display:inline-block;}
.hero h1{font-size:clamp(38px,6vw,64px);line-height:1.05;margin:0 0 22px;font-weight:700;}
.hero h1 em{font-style:normal;color:var(--brass);}
.hero p{font-size:17px;line-height:1.7;color:#c7d1de;max-width:540px;margin:0 0 34px;}
.hero-cta{display:flex;gap:16px;flex-wrap:wrap;}
.btn{display:inline-block;padding:13px 28px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;border-radius:2px;font-weight:600;transition:transform .15s, background .2s;}
.btn-primary{background:var(--red);color:#fff;}
.btn-primary:hover{background:#a91b28;}
.btn-outline{border:1px solid rgba(255,255,255,.4);color:#fff;}
.btn-outline:hover{background:rgba(255,255,255,.08);}

/* stat strip */
.stats{background:var(--navy-2);color:#fff;}
.stats .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding:34px 24px;gap:20px;}
.stat{text-align:center;border-left:1px solid rgba(255,255,255,.12);}
.stat:first-child{border-left:none;}
.stat-num{font-size:clamp(26px,3.4vw,36px);font-weight:600;color:var(--brass);}
.stat-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#aab6c6;margin-top:4px;}

/* SECTION shared */
section{padding:74px 0;}
.section-head{max-width:640px;margin-bottom:44px;}
.kicker{color:var(--red);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
.section-head h2{font-size:clamp(28px,4vw,40px);margin:0 0 14px;font-weight:600;line-height:1.15;}
.section-head p{color:var(--muted);font-size:16px;line-height:1.7;margin:0;}
.alt{background:#fff;}

/* ABOUT */
.about-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:start;}
.about-grid p{color:#33455c;line-height:1.8;font-size:16px;margin:0 0 18px;}
.about-card{background:var(--navy);color:#fff;padding:32px;border-left:4px solid var(--red);}
.about-card h3{margin:0 0 14px;font-size:20px;color:var(--brass);text-transform:uppercase;letter-spacing:.05em;}
.about-card p{color:#cfd8e3;font-size:15px;line-height:1.75;margin:0 0 20px;}
.info-list{list-style:none;margin:0;padding:0;font-size:14px;}
.info-list li{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid rgba(255,255,255,.12);color:#cfd8e3;}
.info-list li span:first-child{color:#8b9bb0;}
.info-list li span:last-child{color:#fff;font-weight:500;text-align:right;}

/* SERVICES */
.svc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--paper-2);}
.svc-card{background:#fff;padding:30px 26px;min-height:200px;display:flex;flex-direction:column;gap:12px;transition:background .2s;}
.svc-card:hover{background:var(--navy);color:#fff;}
.svc-card:hover .svc-num,.svc-card:hover h3{color:var(--brass);}
.svc-card:hover p{color:#c7d1de;}
.svc-num{font-family:'Oswald';font-size:13px;color:var(--red);letter-spacing:.1em;}
.svc-card h3{margin:0;font-size:18px;font-weight:600;}
.svc-card p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.65;}

/* VALUES */
.values-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--paper-2);border:1px solid var(--paper-2);}
.value-card{background:#fff;padding:26px 24px;}
.value-card h4{margin:0 0 8px;font-size:16px;color:var(--red);text-transform:uppercase;letter-spacing:.04em;}
.value-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.65;}

/* PROCESS */
.process{display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative;}
.process::before{content:"";position:absolute;top:19px;left:8%;right:8%;height:1px;background:var(--paper-2);}
.p-step{text-align:center;padding:0 10px;position:relative;}
.p-dot{width:38px;height:38px;border-radius:50%;background:var(--navy);color:var(--brass);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-weight:600;position:relative;z-index:1;font-family:'Oswald';}
.p-step h4{font-size:14px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;}
.p-step p{font-size:13px;color:var(--muted);line-height:1.6;margin:0;}

/* CLIENTS */
.clients-list{columns:3 220px;column-gap:32px;}
.clients-list div{break-inside:avoid;padding:9px 0;border-bottom:1px solid var(--paper-2);font-size:14.5px;color:#33455c;}
.clients-list div b{color:var(--red);font-weight:600;margin-right:8px;font-family:'Oswald';font-size:13px;}
.projects-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px;}
.proj-card{background:#fff;border:1px solid var(--paper-2);padding:20px;}
.proj-card h4{margin:0 0 6px;font-size:15px;color:var(--navy);}
.proj-card span{font-size:13px;color:var(--muted);}

/* CERT */
.cert-wrap{display:grid;grid-template-columns:.9fr 1.1fr;gap:50px;align-items:center;}
.cert-badge{background:#fff;border:1px solid var(--paper-2);padding:40px;text-align:center;position:relative;}
.cert-badge::before{content:"";position:absolute;inset:10px;border:1px solid var(--brass);pointer-events:none;}
.cert-badge .seal{width:70px;height:70px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-family:'Oswald';font-weight:700;font-size:12px;line-height:1.2;}
.cert-badge h3{margin:0 0 6px;font-size:22px;color:var(--navy);}
.cert-badge p{margin:2px 0;color:var(--muted);font-size:14px;}
.cert-copy p{color:#33455c;line-height:1.8;font-size:16px;}
.cert-copy ul{padding-left:20px;color:#33455c;line-height:1.9;font-size:15px;}

/* CONTACT */
.contact{background:var(--navy);color:#fff;}
.contact .section-head h2{color:#fff;}
.contact .section-head p{color:#aab6c6;}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
.contact-card{background:var(--navy-2);border-left:3px solid var(--red);padding:28px;}
.contact-card h4{margin:0 0 6px;color:var(--brass);font-size:13px;text-transform:uppercase;letter-spacing:.08em;}
.contact-card p{margin:0 0 4px;color:#dbe2ea;font-size:15px;line-height:1.6;}
.contact-card a{color:#dbe2ea;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3);}
.contact-list{display:flex;flex-direction:column;gap:18px;}

footer{background:#08131f;color:#7f8ea1;padding:28px 0;font-size:13px;text-align:center;}
footer b{color:#cfd8e3;}

/* RESPONSIVE */
@media (max-width:920px){
  .about-grid{grid-template-columns:1fr;}
  .svc-grid{grid-template-columns:repeat(2,1fr);}
  .values-grid{grid-template-columns:repeat(2,1fr);}
  .process{grid-template-columns:repeat(5,1fr);}
  .cert-wrap{grid-template-columns:1fr;}
  .contact-grid{grid-template-columns:1fr;}
  .projects-grid{grid-template-columns:repeat(2,1fr);}
  .stats .wrap{grid-template-columns:repeat(2,1fr);}
  .client-logos{grid-template-columns:repeat(2,1fr);}
  .gallery{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:680px){
  .nav-links{position:fixed;top:64px;left:0;right:0;background:var(--navy);flex-direction:column;padding:14px 24px 24px;gap:6px;display:none;border-bottom:2px solid var(--red);}
  .nav-links.open{display:flex;}
  .nav-links a{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);}
  .nav-toggle{display:block;}
  .svc-grid{grid-template-columns:1fr;}
  .values-grid{grid-template-columns:1fr;}
  .process{grid-template-columns:1fr;gap:22px;}
  .process::before{display:none;}
  .clients-list{columns:1;}
  .projects-grid{grid-template-columns:1fr;}
  .client-logos{grid-template-columns:1fr;}
  .gallery{grid-template-columns:1fr;}
  .hero{padding:64px 0 54px;}
  section{padding:54px 0;}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;}}
</style>
</head>
